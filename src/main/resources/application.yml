server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8082}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: serene-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/serene}
    username: ${DB_USERNAME:serene}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
